<div class="b-store-list"><% for(const s of stores) { %><article class="b-store-card" data-store-id="<%= s.id %>"><a href="/stores/<%= s.slug %>"><img src="<%= imageOf(s) %>" alt="<%= s.name %>" loading="lazy" width="560" height="360"></a><div class="b-card__body"><h3><a href="/stores/<%= s.slug %>"><%= s.name %></a></h3><p><%= s.address %></p><p class="b-muted"><%= s.hours %></p><% if(s.phone) { %><a href="tel:<%= s.phone.replace(/[^+\d]/g,'') %>"><%= s.phone %></a><% } %><p class="store-distance" aria-live="polite"></p><a class="text-link" href="/stores/<%= s.slug %>">О торговой точке <%- icon('arrow-right') %></a></div></article><% } %></div><% if(!stores.length) { %><p class="b-empty">Адреса торговых точек скоро появятся.</p><% } %>
