<section class="b-request" id="request"><h2>Обсудим сотрудничество</h2><p>Расскажите о вашей организации — мы подберём условия и ассортимент.</p>
<% const available=!!(settings.legalOperator&&settings.privacyText&&settings.consentText); %>
<% if(!available) { %><p class="b-notice">Онлайн-форма готовится к открытию. Свяжитесь с нами через <a href="/contacts">контакты компании</a>.</p><% } %>
<form data-request-form class="b-form"><fieldset <%= !available?'disabled':'' %>><label>Организация<input name="organization" required minlength="2" maxlength="180" autocomplete="organization"></label><label>Контактное лицо<input name="contact" required minlength="2" maxlength="180" autocomplete="name"></label><label>Телефон<input name="phone" required type="tel" minlength="10" maxlength="40" autocomplete="tel"></label><label>Email (необязательно)<input name="email" type="email" maxlength="250" autocomplete="email"></label><label>Направление сотрудничества<select name="direction"><option value="">Выберите при необходимости</option>Поставка продукции</option><option>Закупка для бизнеса</option><option>Другое</option></select></label><label>Комментарий<textarea name="comment" maxlength="5000" rows="4"></textarea></label><label class="b-honeypot" aria-hidden="true">Ваш сайт<input name="website" tabindex="-1" autocomplete="off"></label><label class="b-consent"><input type="checkbox" name="consent" required> <span>Даю <a href="/consent" target="_blank">согласие на обработку персональных данных</a> и ознакомлен с <a href="/privacy" target="_blank">политикой конфиденциальности</a>.</span></label><button class="button" type="submit">Отправить заявку</button></fieldset><p data-form-message role="status" aria-live="polite"></p></form></section>
